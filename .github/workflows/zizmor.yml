---
name: Zizmor

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # Allows zizmor to write security events.
      contents: read # Required for private repositories.
      actions: read # Required for private repositories.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Fork and Dependabot PRs get a read-only token, so SARIF upload to code scanning is not possible.
          advanced-security: ${{ github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
          inputs: |
            .github/*.yml
            .github/workflows/*.yml
