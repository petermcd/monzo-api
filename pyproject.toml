[project]
name = "Monzo-API"
version = "1.3.6"
authors = [{ name = "Peter McDonald", email = "git@petermcdonald.co.uk"}]
description = "Package to interact with the API provided by Monzo bank"
keywords = ["monzo", "bank", "api"]
readme = "README.rst"
license = { file = "LICENSE" }
requires-python = ">=3.12"

classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]

[project.urls]
homepage = "https://github.com/petermcd/monzo-api"
repository = "https://github.com/petermcd/monzo-api.git"
issues = "https://github.com/petermcd/monzo-api/issues"
documentation = "https://monzo-api.readthedocs.io"

[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monzo*"]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "urllib3>=2.8.0", # Sub dependency of requests, but we want to ensure we have the latest version due to security issues in older versions
]
lint = [
    "ruff>=0.16.10",
    "troml>=0.4.1",
    "ty>=0.0.84",
]

[tool.pytest.ini_options]
addopts = "--cov=monzo --cov-report term-missing --cov-report xml:coverage.xml"

[tool.ruff]
line-length = 120

[tool.mutmut]
source_paths = [ "monzo/" ]
runner = "uv run --locked pytest"
pytest_add_cli_args_test_selection= [ "tests/" ]
